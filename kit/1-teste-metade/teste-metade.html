<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qual metade você tem? · Engenheiro de campo de IA</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c10;--card:#16161e;--line:#272730;--tx:#e6e6e6;--mut:#a8a8b3;--amb:#FACC15;--sky:#38bdf8}
@media (prefers-color-scheme: light){:root{--bg:#faf8f3;--card:#fff;--line:#e5e1d8;--tx:#1c1c22;--mut:#55555f;--amb:#a16207;--sky:#0369a1}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Inter,system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:28px 16px 60px}
h1{font-family:Sora,sans-serif;font-size:clamp(1.6rem,5vw,2.3rem);line-height:1.15;margin:.2em 0}
h1 b{color:var(--amb)}.lead{color:var(--mut)}
a{color:var(--sky)}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.q h3{margin:0 0 10px;font-size:1rem}
.q label{display:block;padding:8px 10px;border-radius:8px;cursor:pointer}
.q label:hover{background:rgba(250,204,21,.08)}
.q input{margin-right:8px;accent-color:var(--amb)}
button{background:var(--amb);color:#111;border:0;border-radius:10px;padding:12px 20px;font-weight:700;font-size:1rem;cursor:pointer}
#res{display:none;background:var(--card);border:1px solid var(--amb);border-radius:14px;padding:18px;margin-top:20px}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--amb)}
.falta{color:#f87171;font-weight:600}
</style>
</head>
<body>
<main>
<p><a href="../../guia/">← voltar ao guia</a></p>
<h1>Qual <b>metade</b> você tem?</h1>
<p class="lead">O engenheiro de campo de IA precisa de duas metades: o <b>construtor</b> (faz funcionar e prova) e a <b>confiança do cliente</b> (descobre o problema real e faz o time usar). Responda com sinceridade: 12 perguntas, 3 minutos. Nada sai do seu navegador.</p>
<form id="f"></form>
<p id="aviso" class="falta"></p>
<button type="button" id="ver">Ver meu resultado</button>
<section id="res" aria-live="polite"></section>
</main>
<script>
const DADOS = {"versao": 2, "escala": "cada opçêo vale de 0 a 3 pontos (o campo pontos); a ordem das opções é misturada de propósito; cada metade tem 6 perguntas (0 a 18)", "empate_ate": 1, "metades": {"construtor": "Construtor: faz a coisa funcionar e prova que funciona", "confianca": "Confiança do cliente: descobre o problema real, combina o escopo e faz o time usar"}, "perguntas": [{"id": "c1", "metade": "construtor", "texto": "Na última vez que precisei de um script para automatizar uma tarefa…", "opcoes": [{"texto": "pedi à IA, li o código e testei uma vez", "pontos": 2}, {"texto": "deixei a tarefa como estava, feita à mêo", "pontos": 0}, {"texto": "ajustei o código e testei com casos reais", "pontos": 3}, {"texto": "pedi à IA e usei sem conferir o que ela fez", "pontos": 1}]}, {"id": "c2", "metade": "construtor", "texto": "Ligar dois sistemas por API (ex.: planilha → sistema de vendas):", "opcoes": [{"texto": "já vi alguém fazendo, mas nêo fiz", "pontos": 1}, {"texto": "faço sozinho, quase todo mês", "pontos": 3}, {"texto": "nunca precisei fazer isso até hoje", "pontos": 0}, {"texto": "fiz uma vez, com ajuda de alguém ou da IA", "pontos": 2}]}, {"id": "c3", "metade": "construtor", "texto": "Agente de IA que decide o próximo passo e chama ferramentas:", "opcoes": [{"texto": "tenho um rodando em uso de verdade", "pontos": 3}, {"texto": "montei um simples para testar", "pontos": 2}, {"texto": "entendo a ideia, mas nunca montei nenhum", "pontos": 1}, {"texto": "ainda nêo sei bem o que é isso", "pontos": 0}]}, {"id": "c4", "metade": "construtor", "texto": "Para mostrar que uma automaçêo funciona, eu…", "opcoes": [{"texto": "rodo um eval que dá nota às versões", "pontos": 3}, {"texto": "rodo sempre a mesma lista de casos", "pontos": 2}, {"texto": "testo alguns exemplos na mêo antes de mostrar", "pontos": 1}, {"texto": "mostro ela rodando uma vez, ao vivo", "pontos": 0}]}, {"id": "c5", "metade": "construtor", "texto": "Na última vez que algo que eu fiz quebrou no uso real…", "opcoes": [{"texto": "achei o erro pelo log, com a IA ajudando", "pontos": 2}, {"texto": "corrigi e pus um teste para o caso", "pontos": 3}, {"texto": "pedi para outra pessoa resolver", "pontos": 1}, {"texto": "nêo consegui achar onde estava o erro", "pontos": 0}]}, {"id": "c6", "metade": "construtor", "texto": "Dados bagunçados (datas e nomes em formatos misturados):", "opcoes": [{"texto": "arrumo à mêo, linha por linha", "pontos": 1}, {"texto": "costumo travar e pedir ajuda para alguém", "pontos": 0}, {"texto": "tenho uma regra que arruma, já testada", "pontos": 3}, {"texto": "arrumo com um script ou com a IA", "pontos": 2}]}, {"id": "p1", "metade": "confianca", "texto": "O cliente diz: \"quero um chatbot\". Eu…", "opcoes": [{"texto": "peço para ver o processo e o número dele", "pontos": 3}, {"texto": "pergunto prazo e preço e faço a proposta", "pontos": 1}, {"texto": "começo a montar o chatbot que ele pediu, igual", "pontos": 0}, {"texto": "pergunto o que ele quer resolver com isso", "pontos": 2}]}, {"id": "p2", "metade": "confianca", "texto": "Na última vez que escrevi o escopo de um projeto…", "opcoes": [{"texto": "nêo escrevi, fomos combinando na conversa", "pontos": 0}, {"texto": "escrevi o que ia estar pronto no fim", "pontos": 2}, {"texto": "pus o problema, o número e o que fica fora", "pontos": 3}, {"texto": "fiz a lista de todas as tarefas que eu faria", "pontos": 1}]}, {"id": "p3", "metade": "confianca", "texto": "Na última vez que apresentei para um diretor…", "opcoes": [{"texto": "mostrei o que ficou pronto e o resultado", "pontos": 2}, {"texto": "mostrei como funciona toda a parte técnica", "pontos": 1}, {"texto": "evitei, e outra pessoa apresentou", "pontos": 0}, {"texto": "mostrei o número e o próximo passo", "pontos": 3}]}, {"id": "p4", "metade": "confianca", "texto": "Quando o pedido cresce no meio do projeto…", "opcoes": [{"texto": "aceito tudo e depois reclamo do prazo", "pontos": 1}, {"texto": "explico o que fica fora e por quê", "pontos": 3}, {"texto": "negocio algumas coisas, quando dá", "pontos": 2}, {"texto": "aceito tudo para nêo criar problema", "pontos": 0}]}, {"id": "p5", "metade": "confianca", "texto": "Fazer a equipe do cliente usar o que eu entreguei:", "opcoes": [{"texto": "treino e meço o uso em 2 semanas", "pontos": 3}, {"texto": "entrego e considero o trabalho encerrado", "pontos": 0}, {"texto": "mando um manual explicando o uso passo a passo", "pontos": 1}, {"texto": "faço um treinamento com a equipe", "pontos": 2}]}, {"id": "p6", "metade": "confianca", "texto": "Quando o cliente está bravo ou confuso…", "opcoes": [{"texto": "fico na defensiva e explico o meu lado", "pontos": 0}, {"texto": "escuto tudo e anoto o que ele disse", "pontos": 2}, {"texto": "espero a irritaçêo passar e sigo o trabalho", "pontos": 1}, {"texto": "repito nas palavras dele e combino", "pontos": 3}]}], "planos": {"construtor": {"titulo": "Sua metade mais fraca é a do CONSTRUTOR", "foco": "Você conversa bem; falta fazer funcionar e provar.", "passos": ["Trilha itens 1 a 4: Python com a IA escrevendo, APIs, agentes e EVALS (o principal).", "Rode o eval do kit (passo 5), quebre a automaçêo de propósito e veja a nota cair.", "Troque a automaçêo do eval por uma sua e chegue a uma nota que você defende.", "Só depois faça o projeto-prova (passo 6) com um cliente real."]}, "confianca": {"titulo": "Sua metade mais fraca é a da CONFIANÇA DO CLIENTE", "foco": "Você constrói; falta descobrir o problema certo e fazer o time usar.", "passos": ["Trilha itens 5 a 8: descoberta, escopo, demo para executivo e gestêo de mudança.", "Faça 3 sessões com o cliente simulado (passo 3), em setores diferentes, e anote a nota de cada uma.", "Depois de cada sessêo, escreva o escopo de 1 página (passo 4) e passe no validador.", "Treine a demo de 5 minutos para executivo com o roteiro da entrevista (passo 8)."]}, "empate": {"titulo": "Suas duas metades estêo no mesmo nível", "foco": "O que falta é rodar o ciclo inteiro com um cliente de verdade.", "passos": ["Vá direto ao projeto-prova (passo 6): descoberta, escopo, construir, eval, demo e medir.", "Use o cliente simulado (passo 3) para ensaiar a primeira conversa.", "Ponha um eval (passo 5) em volta do que você construir antes da demo.", "Transforme o resultado em estudo de caso e treine a entrevista (passo 8)."]}}};
// a ordem das opções muda a cada vez que a página abre: a melhor nêo fica sempre no mesmo lugar
function embaralhar(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const f = document.getElementById('f');
DADOS.perguntas.forEach((p, i) => {
  const d = document.createElement('div'); d.className = 'q';
  d.innerHTML = '<h3>' + (i + 1) + '. ' + p.texto + '</h3>' +
    embaralhar(p.opcoes.map((o, j) => [o, j])).map(([o, j]) => '<label><input type="radio" name="' + p.id + '" value="' + j + '">' + o.texto + '</label>').join('');
  f.appendChild(d);
});
function pontuar(respostas) {
  const pontos = {}; Object.keys(DADOS.metades).forEach(m => pontos[m] = 0);
  const maximo = {}; Object.keys(DADOS.metades).forEach(m => maximo[m] = 0);
  DADOS.perguntas.forEach((p, i) => { pontos[p.metade] += p.opcoes[respostas[i]].pontos; maximo[p.metade] += Math.max(...p.opcoes.map(o => o.pontos)); });
  const dif = pontos.construtor - pontos.confianca;
  const fraca = Math.abs(dif) <= DADOS.empate_ate ? 'empate' : (dif < 0 ? 'construtor' : 'confianca');
  return {pontos, maximo, fraca, plano: DADOS.planos[fraca]};
}
document.getElementById('ver').onclick = () => {
  const resp = DADOS.perguntas.map(p => { const e = f.querySelector('input[name="' + p.id + '"]:checked'); return e ? +e.value : null; });
  const faltam = resp.filter(r => r === null).length;
  document.getElementById('aviso').textContent = faltam ? 'Faltam ' + faltam + ' resposta(s).' : '';
  if (faltam) return;
  const r = pontuar(resp), out = document.getElementById('res');
  out.innerHTML = Object.keys(DADOS.metades).map(m =>
    '<div><b>' + DADOS.metades[m].split(':')[0] + '</b>: ' + r.pontos[m] + '/' + r.maximo[m] +
    '<div class="bar"><i style="width:' + (100 * r.pontos[m] / r.maximo[m]) + '%"></i></div></div>').join('') +
    '<h2>' + r.plano.titulo + '</h2><p>' + r.plano.foco + '</p><ol>' + r.plano.passos.map(s => '<li>' + s + '</li>').join('') + '</ol>' +
    '<p>Os passos estêo no kit: <a href="https://github.com/linnoff88-dev/engenheiro-de-campo">github.com/linnoff88-dev/engenheiro-de-campo</a></p>';
  out.style.display = 'block'; out.scrollIntoView({behavior: 'smooth'});
};
</script>
</body>
</html>
